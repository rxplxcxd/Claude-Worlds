name: Build & Deploy (Web)

# Builds the Godot web export on every push / pull request and runs the
# headless test suite. Deploys to GitHub Pages only from the default branch
# (main) or when started manually. See docs/BUILD_AND_DEPLOYMENT.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-web-v1

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TPL"
          # Only the web templates are needed (saves ~1 GB of cache).
          unzip -q -j /tmp/templates.tpz \
            templates/version.txt \
            templates/web_nothreads_release.zip \
            templates/web_nothreads_debug.zip \
            -d "$TPL"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run tests
        run: ~/godot/godot --headless --path . res://tests/test_runner.tscn

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/index.manifest.json
          test -s build/web/index.service.worker.js
          touch build/web/.nojekyll
          ls -la build/web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worlds-web-${{ github.sha }}
          path: build/web
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
