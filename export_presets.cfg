custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"apple-mobile-web-app-title\" content=\"WORLDS\">
<meta name=\"theme-color\" content=\"#121720\">
<meta name=\"description\" content=\"WORLDS – lebendige Gesellschaftssimulation \">
<style>html,body{background:#121720;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#worlds-version{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font:600 14px -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.62);letter-spacing:.04em;pointer-events:none;z-index:10}</style>
<script>
/* Loading screen: version from build/web/version.json (written from data/version.json at export). */
window.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='worlds-version';d.textContent='WORLDS';document.body.appendChild(d);
fetch('version.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){d.textContent='WORLDS '+v.product+'  |  Build '+v.technical+(v.commit?' ('+v.commit+')':'')}).catch(function(){});
var t0=Date.now();var t=setInterval(function(){var s=document.getElementById('status');var gone=!s||getComputedStyle(s).display==='none'||getComputedStyle(s).visibility==='hidden'||getComputedStyle(s).opacity==='0';if(gone&&Date.now()-t0>1500){d.style.transition='opacity .8s';d.style.opacity='0';clearInterval(t)}},400);});
</script>"
